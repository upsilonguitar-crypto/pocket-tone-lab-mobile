name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run offline codec tests
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/mobile_api.js
          node --check app/src/main/assets/www/mobile_connector.js
          node --check app/src/main/assets/www/mobile_extras.js
          node --check app/src/main/assets/www/tone_match_core.js
          node --check app/src/main/assets/www/tone_match.js
          node --check app/src/main/assets/www/mobile_v8.js
          node --check app/src/main/assets/www/bootstrap.js
          node tools/test_tone_match.js
          node tools/test_tone_match_iterative.js
          node tools/test_v8_true_mobile_viewport.js

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-tone-lab-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
